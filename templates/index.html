<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - CRUD</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
<div class="container">
    <header class="header">
        <h1>Gestión de Usuarios</h1>
        
    </header>

    <section class="card">
        <h2>Agregar Usuario</h2>
        <form id="form-crear" action="/crear" method="POST" class="form-grid">
            <div class="form-group">
                <input type="text" name="nombre" placeholder="Nombre completo" required>
            </div>
            <div class="form-group">
                <input type="email" name="correo" placeholder="Correo electrónico" required>
            </div>
            <div class="form-group">
                <input type="text" name="rol" placeholder="Rol o cargo" required>
            </div>
            <button type="submit" class="btn btn-add">Guardar</button>
        </form>
    </section>

    <section class="card">
        <h2>Lista de Registros</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Rol</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for u in usuarios %}
                    <tr>
                        <form action="/editar/{{ u.id }}" method="POST">
                            <td><span class="badge">#{{ u.id }}</span></td>
                            <td><input type="text" name="nombre" value="{{ u.nombre }}" required class="input-table"></td>
                            <td><input type="email" name="correo" value="{{ u.correo }}" required class="input-table"></td>
                            <td><input type="text" name="rol" value="{{ u.rol }}" required class="input-table"></td>
                            <td class="actions-cell">
                                <button type="submit" class="btn btn-edit">Actualizar</button>
                                <a href="/eliminar/{{ u.id }}" class="btn btn-delete btn-eliminar-confirm" data-nombre="{{ u.nombre }}">Eliminar</a>
                            </td>
                        </form>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="5" class="empty-state">No hay registros almacenados en la base de datos.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </section>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
