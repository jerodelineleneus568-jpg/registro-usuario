<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CRUD con MySQL</title>
    
</head>
<body>
<div class="container">
    <h1>Gestión de Usuarios (MySQL + Python)</h1>
    <h3>Agregar Usuario</h3>
    <form action="/crear" method="POST">
        <input type="text" name="nombre" placeholder="Nombre completo" required>
        <input type="email" name="correo" placeholder="Correo electrónico" required>
        <input type="text" name="rol" placeholder="Rol / Cargo" required>
        <button type="submit" class="btn-add">Guardar</button>
    </form>
    <h3>Lista de Registros</h3>
    <table>
        <thead>
            <tr>
                <th>ID</th><th>Nombre</th><th>Correo</th><th>Rol</th><th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for u in usuarios %}
            <tr>
                <form action="/editar/{{ u.id }}" method="POST">
                    <td><strong>#{{ u.id }}</strong></td>
                    <td><input type="text" name="nombre" value="{{ u.nombre }}" required></td>
                    <td><input type="email" name="correo" value="{{ u.correo }}" required></td>
                    <td><input type="text" name="rol" value="{{ u.rol }}" required></td>
                    <td class="actions-cell">
                        <button type="submit" class="btn-edit">Actualizar</button>
                        <a href="/eliminar/{{ u.id }}" class="btn-del" onclick="return confirm('¿Seguro que deseas eliminar este registro?');">Eliminar</a>
                    </td>
                </form>
            </tr>
            {% else %}
            <tr><td colspan="5" style="text-align:center; color:#888;">No hay registros en la base de datos.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
