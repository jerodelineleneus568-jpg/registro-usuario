<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - CRUD</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
<div class="container">
    <header class="header">
        <h1>Gestión de Usuarios</h1>
        
    </header>

    <section class="card">
        <h2>Agregar Usuario</h2>
        <form id="form-crear" action="/crear" method="POST" class="form-grid">
            <div class="form-group">
                <input type="text" name="nombre" placeholder="Nombre completo" required>
            </div>
            <div class="form-group">
                <input type="email" name="correo" placeholder="Correo electrónico" required>
            </div>
            <div class="form-group">
                <input type="text" name="rol" placeholder="Rol o cargo" required>
            </div>
            <button type="submit" class="btn btn-add">Guardar</button>
        </form>
    </section>

    <section class="card">
        <h2>Lista de Registros</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Rol</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for u in usuarios %}
                   <tr>
    <!-- Formulario invisible que procesa la edición de esta fila -->
    <form id="form-editar-{{ u.id }}" action="/editar/{{ u.id }}" method="POST"></form>

    <td><span class="badge">#{{ u.id }}</span></td>
    
    <!-- Cada input se asocia al formulario mediante form="form-editar-{{ u.id }}" -->
    <td>
        <input type="text" name="nombre" value="{{ u.nombre }}" required class="input-table" form="form-editar-{{ u.id }}">
    </td>
    <td>
        <input type="email" name="correo" value="{{ u.correo }}" required class="input-table" form="form-editar-{{ u.id }}">
    </td>
    <td>
        <input type="text" name="rol" value="{{ u.rol }}" required class="input-table" form="form-editar-{{ u.id }}">
    </td>
    
    <td class="actions-cell">
        <!-- Botón que envía el formulario de actualización -->
        <button type="submit" form="form-editar-{{ u.id }}" class="btn btn-edit">Actualizar</button>
        
        <!-- Formulario POST independiente para eliminar de forma segura -->
        <form action="/eliminar/{{ u.id }}" method="POST" style="display:inline;" onsubmit="return confirm('¿Seguro que deseas eliminar a {{ u.nombre }}?');">
            <button type="submit" class="btn btn-delete">Eliminar</button>
        </form>
    </td>
</tr>
                    {% else %}
                    <tr>
                        <td colspan="5" class="empty-state">No hay registros almacenados en la base de datos.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </section>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
